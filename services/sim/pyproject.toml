[project]
name = "ploshcha-sim"
version = "0.0.1"
description = "Площа — агентний движок (дослідницький harness + прод-стрім)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
retrieval = ["pymorphy3>=2.0", "pymorphy3-dicts-uk", "rank-bm25>=0.2"]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:asyncio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ploshcha_sim"]
