[project]
name = "ploshcha"
version = "0.0.0"
description = "ПЛОЩА — generative-agents бек (Python); код у services/sim"
requires-python = ">=3.11"
dependencies = []

# Корінь залежностей не тримає: вони живуть у services/sim/pyproject.toml.
# Тут — лише контейнер uv-воркспейсу.

[tool.uv]
package = false  # корінь — лише workspace-контейнер, не пакет для збірки

[tool.uv.workspace]
members = ["services/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["services", "eval"]
