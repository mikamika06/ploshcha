name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    name: contract conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Версію pnpm бере з "packageManager" у package.json.
      # Дублювати її тут через `version:` — помилка (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Кожен рядок фікстур мусить валідуватися проти zod-контракту (13/13 типів).
      # Коли зʼявиться Pydantic-дзеркало (Фаза 4) — сюди додається гейт паритету TS↔Py.
      - run: pnpm --filter @ploshcha/contract-ts validate

  sim:
    name: sim unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Детерміноване ядро мусить бути зеленим без мережі й без LLM.
      #
      # `retrieval` тут не забаганка: реєстр записів відмінює українські назви («Сухому Яру» →
      # «Сухий Яр») через pymorphy3, і без нього 17 тестів падають на CI, лишаючись зеленими
      # локально — рівно там, де морфологія колись стала до venv руками.
      - run: uv run --frozen --extra dev --extra retrieval pytest
        working-directory: services/sim

  web:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Типи й збірка — окремі гейти: тип може бути цілим, а збірка падати на ассеті.
      - run: npx tsc --noEmit
        working-directory: apps/web
      # Порожній VITE_LIVE_URL = режим фікстури: збірка не потребує ані ядра, ані ключів.
      - run: npx vite build
        working-directory: apps/web

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Гачок `.githooks/pre-commit` рятує лише того, хто його ввімкнув. Гейт мусить бути тут.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
