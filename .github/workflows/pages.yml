name: pages

# Вітрина — це СТАТИКА без ядра: коли `VITE_LIVE_URL` порожній, фронт програє записаний прогін
# із фікстури. Тобто публічний сайт не має ані ключів, ані витрат, ані відкритого `/command`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build (fixture mode)
        working-directory: apps/web
        env:
          PLOSHCHA_BASE: /ploshcha/
          VITE_LIVE_URL: ""
        run: npx vite build
      # Дев-редактор розкладки не має їхати у вітрину: він без автентифікації й тягне палітру,
      # якій на публічному сайті нема чого робити.
      - run: rm -f apps/web/dist/layout_editor.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
